name: OpenNext Cloudflare preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_USE_SYSTEM_CA: "1"
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext worker
        shell: bash
        run: |
          if [ -z "${MONGODB_URI:-}" ]; then
            echo "::error::Configure the MONGODB_URI GitHub Actions secret before running this workflow."
            exit 1
          fi
          pnpm exec opennextjs-cloudflare build

      - name: Verify OpenNext output
        shell: bash
        run: |
          set -euo pipefail
          test -s .open-next/worker.js
          test -d .open-next/assets
          asset_count="$(find .open-next/assets -type f | wc -l)"
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::.open-next/assets is empty."
            exit 1
          fi
          echo "Verified .open-next/worker.js and $asset_count asset files."

      - name: Preview worker and smoke-test MongoDB API
        shell: bash
        run: |
          set -euo pipefail
          preview_pid=""
          cleanup() {
            if [ -n "$preview_pid" ]; then
              kill -- "-$preview_pid" >/dev/null 2>&1 || true
              wait "$preview_pid" >/dev/null 2>&1 || true
            fi
            rm -f .dev.vars
          }
          trap cleanup EXIT

          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const uri = process.env.MONGODB_URI;
          if (!uri) {
            console.error("MONGODB_URI is required for the local Worker preview.");
            process.exit(1);
          }
          writeFileSync(
            ".dev.vars",
            `MONGODB_URI=${JSON.stringify(uri)}\nNODE_USE_SYSTEM_CA=1\n`,
            { mode: 0o600 },
          );
          NODE

          preview_log="$RUNNER_TEMP/opennext-preview.log"
          setsid pnpm exec opennextjs-cloudflare preview >"$preview_log" 2>&1 &
          preview_pid=$!

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8787/about; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::OpenNext preview did not become ready."
            node - "$preview_log" <<'NODE'
          const { readFileSync } = require("node:fs");
          const logPath = process.argv[2];
          let log = readFileSync(logPath, "utf8");
          const uri = process.env.MONGODB_URI;
          if (uri) log = log.split(uri).join("[REDACTED]");
          log = log.replace(/mongodb(?:\+srv)?:\/\/[^\s"'<>]+/gi, "[REDACTED_MONGODB_URI]");
          console.error(log.split("\n").slice(-80).join("\n"));
          NODE
            exit 1
          fi
          echo "OpenNext preview served /about."

          status="$(curl --silent --output "$RUNNER_TEMP/jobs.json" --write-out '%{http_code}' http://127.0.0.1:8787/api/jobs)"
          if [ "$status" != "200" ]; then
            echo "::error::Mongo-backed /api/jobs returned HTTP $status."
            node - "$preview_log" <<'NODE'
          const { readFileSync } = require("node:fs");
          const logPath = process.argv[2];
          let log = readFileSync(logPath, "utf8");
          const uri = process.env.MONGODB_URI;
          if (uri) log = log.split(uri).join("[REDACTED]");
          log = log.replace(/mongodb(?:\+srv)?:\/\/[^\s"'<>]+/gi, "[REDACTED_MONGODB_URI]");
          console.error(log.split("\n").slice(-80).join("\n"));
          NODE
            exit 1
          fi
          node - "$RUNNER_TEMP/jobs.json" <<'NODE'
          const { readFileSync } = require("node:fs");
          const response = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (response.success !== true || !Array.isArray(response.data)) {
            console.error("Mongo-backed /api/jobs returned an unexpected response shape.");
            process.exit(1);
          }
          console.log("Mongo-backed /api/jobs returned success with an array payload.");
          NODE

      - name: Sanitize preview log
        if: always()
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          source="$RUNNER_TEMP/opennext-preview.log"
          target="$RUNNER_TEMP/opennext-preview-redacted.log"
          if [ -f "$source" ]; then
            node - "$source" "$target" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const source = process.argv[2];
          const target = process.argv[3];
          let log = readFileSync(source, "utf8");
          const uri = process.env.MONGODB_URI;
          if (uri) log = log.split(uri).join("[REDACTED]");
          log = log.replace(/mongodb(?:\+srv)?:\/\/[^\s"'<>]+/gi, "[REDACTED_MONGODB_URI]");
          writeFileSync(target, log, { mode: 0o600 });
          NODE
          fi

      - name: Retain sanitized preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opennext-preview-log
          path: ${{ runner.temp }}/opennext-preview-redacted.log
          if-no-files-found: ignore
          retention-days: 7
